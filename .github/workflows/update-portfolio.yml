name: Aggiorna portfolio

on:
  # ogni giorno alle 04:30 UTC
  schedule:
    - cron: "30 4 * * *"
  # a ogni push su main/develop
  push:
    branches: [ main, develop ]
  # avvio manuale dal tab Actions
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-portfolio
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Genera projects.json dai repository GitHub
        env:
          GITHUB_USER: XtremeAlex
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/build-projects.mjs

      - name: Commit se ci sono cambiamenti
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- projects.json; then
            git add projects.json
            git commit -m "chore: aggiorna projects.json [skip ci]"
            git push
          else
            echo "Nessun cambiamento nei progetti."
          fi
